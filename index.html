
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Friends 💗</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fff0f5;
 color:#26345c;
 text-align:center;
 padding:25px 15px;
}
.card{
 max-width:440px;
 margin:auto;
 background:white;
 padding:25px 20px;
 border-radius:28px;
 box-shadow:0 8px 30px #e8b8ca;
}
.bear{font-size:75px}
h1{color:#f05b91;font-size:30px}
p{color:#69738c}
input{
 width:100%;padding:14px;
 border:1px solid #f3b5cc;
 border-radius:15px;
 font-size:16px;
 margin:10px 0;
}
.question{
 text-align:left;
 background:#fff4f8;
 padding:15px;
 border-radius:16px;
 margin:15px 0;
}
.question label{
 display:block;
 padding:9px;
 cursor:pointer;
}
button{
 border:0;
 background:#f05b91;
 color:white;
 padding:15px 25px;
 border-radius:30px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
 margin:10px 0;
 width:100%;
}
#result{
 display:none;
 background:#fff0f5;
 padding:20px;
 border-radius:20px;
 margin-top:20px;
}
</style>
</head>
<body>
<div class="card">
 <div class="bear">🐻‍❄️</div>
 <h1>Find Your Fake Friends!</h1>
 <p>Let's see how well you know your friend 💗</p>

 <input id="name" placeholder="Enter your name">

 <form id="quiz">

 <div class="question">
 <b>1. Do you trust your friend?</b>
 <label><input type="radio" name="q1" value="1" required> Always 💗</label>
 <label><input type="radio" name="q1" value="0"> Not really 🤔</label>
 </div>

 <div class="question">
 <b>2. Do you keep their secrets?</b>
 <label><input type="radio" name="q2" value="1" required> Of course!</label>
 <label><input type="radio" name="q2" value="0"> Sometimes 😅</label>
 </div>

 <div class="question">
 <b>3. Are you there when they need you?</b>
 <label><input type="radio" name="q3" value="1" required> Always!</label>
 <label><input type="radio" name="q3" value="0"> Not always</label>
 </div>

 <div class="question">
 <b>4. Do you get jealous of their other friends?</b>
 <label><input type="radio" name="q4" value="1" required> A little 🥺</label>
 <label><input type="radio" name="q4" value="0"> Never!</label>
 </div>

 <div class="question">
 <b>5. Will you stay friends forever?</b>
 <label><input type="radio" name="q5" value="1" required> Forever ♾️</label>
 <label><input type="radio" name="q5" value="0"> Who knows?</label>
 </div>

 <button type="submit">Find My Result 💕</button>
 </form>

 <div id="result">
 <div style="font-size:55px">💗</div>
 <h2 id="resultTitle"></h2>
 <p id="resultText"></p>
 <button onclick="shareResult()">Share Result 🔗</button>
 <button onclick="location.reload()" style="background:#8799c8">Try Again</button>
 </div>
</div>

<script>
document.getElementById("quiz").addEventListener("submit",function(e){
 e.preventDefault();
 let score=0;
 for(let i=1;i<=5;i++){
 score+=Number(document.querySelector('input[name="q'+i+'"]:checked').value);
 }
 let name=document.getElementById("name").value.trim() || "Friend";
 document.getElementById("resultTitle").innerText=
 score>=4 ? "Real Friend! 🥰" :
 score>=2 ? "Maybe a Little Fake! 👀" :
 "Friendship Needs Attention! 💔";
 document.getElementById("resultText").innerText=
 name+", your friendship score is "+score+"/5!";
 document.getElementById("result").style.display="block";
});
function shareResult(){
 let message="I just took the Fake Friends quiz! 💗";
 if(navigator.share){
 navigator.share({title:"Fake Friends",text:message,url:location.href});
 }else{
 navigator.clipboard.writeText(message+" "+location.href);
 alert("Copied!");
 }
}
</script>
</body>
</html>
